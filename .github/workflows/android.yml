# Builds the Android app (android/): the Rust core for arm64-v8a with UniFFI Kotlin bindings and
# PDFium, then the debug APK, uploaded as a workflow artifact; for a release (release.yml), the APK
# signed with the release key from the repository secrets, and the Google Play bundle (AAB: the same
# app, key and version code, without the GitHub updater; docs/google-play.md), both attached to the
# release. With the secret PLAY_SERVICE_ACCOUNT_JSON the bundle also goes to a Play track (variable
# PLAY_TRACK, default internal); without it that step is skipped. Google sign-in needs an OAuth client
# id (repository variable LUNTA_GOOGLE_CLIENT_ID); without it the app builds and explains that.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'core/**', 'desktop/src/reader/**', 'scripts/build-core-android.sh', 'scripts/extract-reader-assets.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'core/**', 'desktop/src/reader/**', 'scripts/build-core-android.sh', 'scripts/extract-reader-assets.mjs', '.github/workflows/android.yml']
  workflow_dispatch:
  # release.yml runs this for a version tag and attaches the result to the release
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      LUNTA_GOOGLE_CLIENT_ID: ${{ vars.LUNTA_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Reader assets are up to date
        run: node scripts/extract-reader-assets.mjs --check

      # with llama.cpp (on-device AI), built by the runner's CMake with the NDK's toolchain file
      - name: Core for Android (arm64-v8a, x86_64) + Kotlin bindings + PDFium
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ABIS="arm64-v8a x86_64" scripts/build-core-android.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lunta-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # a release: signed with the release key (repository secrets), so later versions install over it.
      # The APK for GitHub (with the updater), then the bundle for Google Play (LUNTA_SELF_UPDATE=false:
      # no updater, no REQUEST_INSTALL_PACKAGES), with the same key and version code
      - name: Signed release APK and Play bundle
        if: inputs.release_tag != ''
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LUNTA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUNTA_VERSION_NAME: ${{ inputs.release_tag }}
          LUNTA_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          export LUNTA_KEYSTORE="$RUNNER_TEMP/release.jks" LUNTA_VERSION_NAME="${LUNTA_VERSION_NAME#v}"
          ./gradlew :app:assembleRelease --no-daemon
          LUNTA_SELF_UPDATE=false ./gradlew :app:bundleRelease --no-daemon

      - name: Attach to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.release_tag }}"; v="${v#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "Lunta-$v-Android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "Lunta-$v-Google-Play.aab"
          gh release upload "${{ inputs.release_tag }}" --clobber -R "${{ github.repository }}" "Lunta-$v-Android.apk" "Lunta-$v-Google-Play.aab"

      # optional: the bundle to a Google Play track through the Play Developer API, with a service
      # account's JSON key (docs/google-play.md, "Uploading from CI"); skipped without the secret
      - name: Play upload configured?
        id: play
        if: inputs.release_tag != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"
          else echo "No PLAY_SERVICE_ACCOUNT_JSON secret: not uploading to Google Play"; fi

      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.lunta
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ inputs.release_tag }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          # "draft" until the app's first release has been sent for review in Play Console (Play
          # refuses anything else for a draft app); then "completed"
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
