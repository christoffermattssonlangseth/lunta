[package]
name = "margins-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Library, metadata, search, sync and citation core for the Margins reference manager"

[lib]
name = "margins_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = "3"
thiserror = "2"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
