<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Lunta app icon (dark variant: near-black teal ground, dimmed paper): a page with a margin rule, a highlighted passage and a margin note -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10222a"/>
      <stop offset="1" stop-color="#060d10"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcbc3"/>
      <stop offset="1" stop-color="#b5b0a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- page with folded corner -->
  <g filter="url(#shadow)">
    <path d="M262 168 H668 L790 290 V856 H262 Z" fill="url(#page)"/>
    <path d="M668 168 V290 H790 Z" fill="#8e887c"/>
  </g>

  <!-- margin rule -->
  <rect x="352" y="214" width="12" height="596" rx="6" fill="#c2703d"/>

  <!-- text lines -->
  <g fill="#6c777b">
    <rect x="404" y="330" width="318" height="22" rx="11"/>
    <rect x="404" y="390" width="290" height="22" rx="11"/>
    <rect x="404" y="570" width="318" height="22" rx="11"/>
    <rect x="404" y="630" width="250" height="22" rx="11"/>
    <rect x="404" y="690" width="300" height="22" rx="11"/>
  </g>

  <!-- highlighted passage -->
  <rect x="392" y="438" width="346" height="96" rx="18" fill="#f2b45a" opacity="0.8"/>
  <rect x="404" y="456" width="318" height="22" rx="11" fill="#7a5a2c" opacity="0.55"/>
  <rect x="404" y="494" width="236" height="22" rx="11" fill="#7a5a2c" opacity="0.55"/>

  <!-- margin note mark next to the highlight -->
  <circle cx="306" cy="486" r="26" fill="#c2703d"/>
</svg>
