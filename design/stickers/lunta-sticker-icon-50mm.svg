<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="54mm" height="54mm" viewBox="0 0 54 54">
<title>Lunta sticker, 50 x 50 mm die-cut (artwork, white border, 2 mm bleed; cut line on layer CutContour)</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6478"/><stop offset="1" stop-color="#173e4c"/></linearGradient>
<linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#efe9de"/></linearGradient><clipPath id="art"><rect x="5.0" y="5.0" width="44" height="44" rx="9.8428"/></clipPath></defs>
<g id="Bleed"><rect width="54" height="54" fill="#ffffff"/></g>
<g id="Artwork" clip-path="url(#art)"><rect x="5.0" y="5.0" width="44" height="44" fill="url(#bg)"/>
<g transform="translate(5.0 5.0) scale(0.04296875)">

  <!-- page with folded corner -->
  <g>
    <path d="M262 168 H668 L790 290 V856 H262 Z" fill="url(#page)"/>
