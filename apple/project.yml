# Generate the Xcode project with:  cd apple && xcodegen generate
name: Lunta
options:
  bundleIdPrefix: com.cmlangseth
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  LuntaCore:
    path: LuntaCore
  Paper2EpubKit:
    path: Paper2EpubKit
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.18.3"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: "3.32.3"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

settings:
  base:
    DEVELOPMENT_TEAM: 7R6QL53THM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "202611171"

targets:
  LuntaMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
      - Assets.xcassets
      - Lunta.icon   # Icon Composer bundle: light/dark/tinted on macOS 26
      - path: ../tts/lunta_tts.py
        buildPhase: resources
      - path: citations
        type: folder
        buildPhase: resources
    dependencies:
      - target: LuntaSafariMac
      - package: LuntaCore
        product: LuntaCore
      - package: Paper2EpubKit
        product: Paper2EpubKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXFoundationModels
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    postCompileScripts:
      - name: Embed lunta-mcp (agent server and CLI)
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          cd "$SRCROOT/../core" && cargo build --release --bin lunta-mcp
          dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/lunta-mcp"
          cp -f target/release/lunta-mcp "$dest"
          codesign --force --options runtime --timestamp=none -s "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$dest"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Lunta
        CFBundleName: Lunta
        LSApplicationCategoryType: public.app-category.education
        CFBundleURLTypes:
          - CFBundleURLName: com.cmlangseth.margins
            CFBundleURLSchemes: [lunta, margins]   # margins:// from before the rename
        NSHumanReadableCopyright: ""
    entitlements:
      path: Mac/Lunta.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_NAME: Lunta
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins
        ASSETCATALOG_COMPILER_APPICON_NAME: Lunta
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-lc++"]
        # Apple silicon only: the Rust core is built for arm64 (scripts/build-core.sh), and Apple
        # Intelligence and the MLX models need Apple silicon anyway
        ARCHS: arm64

  LuntaiOS:
    type: application
    platform: iOS
    sources: [iOS, Shared, Assets.xcassets, ShareExtension/ShareInbox.swift]
    dependencies:
      - target: LuntaShare
      - target: LuntaSafari
      - package: LuntaCore
        product: LuntaCore
      - package: Paper2EpubKit
        product: Paper2EpubKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXFoundationModels
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: FluidAudio
        product: FluidAudio
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Lunta
        CFBundleURLTypes:
          - CFBundleURLName: com.cmlangseth.margins.ios
            CFBundleURLSchemes: [lunta]   # lunta://safari from the Safari extension's panel
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.cmlangseth.margins.ios.foryou]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: iOS/Lunta.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cmlangseth.margins]
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_NAME: Lunta
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        TARGETED_DEVICE_FAMILY: "1,2"

  LuntaShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Lunta
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/LuntaShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cmlangseth.margins]
    settings:
      base:
        PRODUCT_NAME: LuntaShare
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins.ios.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Safari Web Extension (Mac): the browser extension in extension/, as is; it talks to Lunta for
  # Mac on 127.0.0.1:47480 like Chrome and Firefox. Embedded in LuntaMac.
  LuntaSafariMac:
    type: app-extension
    platform: macOS
    sources: [SafariExtension/SafariWebExtensionHandler.swift]
    preBuildScripts:
      # runs only when extension/ changes, so an unchanged extension keeps its signature
      - &safariExtensionFiles
        name: Browser extension files (extension/)
        script: "\"$SRCROOT/SafariExtension/copy-extension.sh\""
        inputFiles:
          - $(SRCROOT)/SafariExtension/copy-extension.sh
          - $(SRCROOT)/../extension/manifest.json
          - $(SRCROOT)/../extension/background.js
          - $(SRCROOT)/../extension/content.js
          - $(SRCROOT)/../extension/gdocs/config.js
          - $(SRCROOT)/../extension/gdocs/citations-common.js
          - $(SRCROOT)/../extension/gdocs/docs-model.js
          - $(SRCROOT)/../extension/gdocs/flow.js
          - $(SRCROOT)/../extension/gdocs/background-gdocs.js
          - $(SRCROOT)/../extension/gdocs/panel.js
          - $(SRCROOT)/../extension/icons/icon-16.png
          - $(SRCROOT)/../extension/icons/icon-32.png
          - $(SRCROOT)/../extension/icons/icon-48.png
          - $(SRCROOT)/../extension/icons/icon-128.png
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/manifest.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/background.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/content.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/gdocs/config.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/gdocs/citations-common.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/gdocs/docs-model.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/gdocs/flow.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/gdocs/background-gdocs.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/gdocs/panel.js
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/icons/icon-16.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/icons/icon-32.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/icons/icon-48.png
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/icons/icon-128.png
    info:
      path: SafariExtension/Mac-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Lunta
        NSHumanReadableCopyright: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/LuntaSafariMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: LuntaSafari
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins.safari
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SKIP_INSTALL: YES
        ARCHS: arm64

  # Safari Web Extension (iPhone, iPad): the same extension files; with no Lunta server on the
  # device, background.js sends its requests to SafariWebExtensionHandler, which leaves them in the
  # App Group (SafariInbox) for the app. Embedded in LuntaiOS.
  LuntaSafari:
    type: app-extension
    platform: iOS
    sources:
      - SafariExtension/SafariWebExtensionHandler.swift
      - SafariExtension/PrivacyInfo.xcprivacy
      - Shared/SafariInbox.swift
    preBuildScripts:
      - *safariExtensionFiles
    info:
      path: SafariExtension/iOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Lunta
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/LuntaSafari.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cmlangseth.margins]
    settings:
      base:
        PRODUCT_NAME: LuntaSafari
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins.ios.safari
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SKIP_INSTALL: YES
