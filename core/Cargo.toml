[package]
name = "lunta-core"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "Library, metadata, search, sync and citation core for the Lunta reference manager"

[lib]
name = "lunta_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "lunta-mcp"
path = "src/bin/lunta-mcp.rs"

[[bin]]
name = "lunta-sync"
path = "src/bin/lunta-sync.rs"
required-features = ["drive"]

[[bin]]
name = "paper2epub"
path = "src/bin/paper2epub.rs"
required-features = ["convert"]

[[example]]
name = "ai"
required-features = ["llm"]

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = "3"
thiserror = "2"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# the HTML / XML DOM (core/src/convert/xml.rs, html.rs): the converter, and web pages in every build
quick-xml = "0.38"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "tiff", "bmp", "webp"], optional = true }
ab_glyph = { version = "0.2", optional = true }
url = { version = "2", optional = true }
ttf-parser = { version = "0.25", optional = true }
icu_normalizer = { version = "2", optional = true }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"], optional = true }
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }
hayagriva = { version = "0.10.1", default-features = false, features = ["csl-json", "archive"] }
# Listen (core/src/tts): the natural voice's download (tar.bz2) and its engine, loaded at run time
bzip2 = { version = "0.6", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
libloading = { version = "0.9", optional = true }

# On-device AI (core/src/llm): llama.cpp, built from source with CMake (CPU; Metal on macOS)
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }

# Android: llama.cpp with the NDK's static C++ library (nothing more to ship in the APK)
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["android-static-stdcxx"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true

# The operating system's trust store for HTTPS (KI-style networks that inspect TLS with their own CA,
# which IT installs on managed computers): macOS/iOS, Windows, Linux. Android keeps webpki roots
# (the platform verifier needs JNI setup there).
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3", features = ["platform-verifier"] }

[features]
# The paper -> EPUB converter (core/src/convert). On by default for `cargo build/test/run`;
# scripts/build-core.sh builds the Apple static library with --no-default-features, so the
# apps' LuntaCore stays as it was (they keep using the Swift Paper2EpubKit).
default = ["convert", "pdf", "drive", "tts"]
convert = ["dep:image", "dep:ab_glyph", "dep:ttf-parser", "dep:url"]
# PDF -> EPUB layout analysis (core/src/convert/pdf) on PDFium, loaded at run time (see README).
# Off in the Apple build, which converts PDFs with PDFKit.
pdf = ["convert", "dep:pdfium-render", "dep:icu_normalizer"]
# Google Drive sync (core/src/drive): RemoteStore trait, Google Drive REST client with OAuth (PKCE),
# local-folder remote and the Syncer. Not part of the Apple static library (--no-default-features).
drive = ["dep:sha2", "dep:md-5", "dep:base64", "dep:getrandom"]
# Listen (core/src/tts): text made ready for speech, the natural voice (Kokoro-82M through
# sherpa-onnx's C API, loaded at run time: downloaded with the model on Windows, Linux and macOS,
# in the APK on Android) and its download. For the desktop and Android apps; not in the Apple build.
tts = ["dep:bzip2", "dep:tar", "dep:libloading", "dep:sha2"]
# On-device AI (core/src/llm): the open model (Qwen3, GGUF) on llama.cpp for summaries and Ask in
# the desktop and Android apps; its download, prompts and summary.json. Not in the Apple build.
llm = ["dep:llama-cpp-2", "dep:sha2"]
