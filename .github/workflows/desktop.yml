# Builds the desktop app (desktop/, Tauri 2) for Windows (MSI + NSIS installer) and Linux
# (AppImage + .deb), and uploads the installers as workflow artifacts.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'core/**', 'apple/Shared/**', 'scripts/extract-reader-assets.mjs', 'scripts/reader-tests/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'core/**', 'apple/Shared/**', 'scripts/extract-reader-assets.mjs', 'scripts/reader-tests/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
  # release.yml runs this for a version tag and attaches the result to the release
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
          # llama.cpp for on-device AI (the core's feature llm): CMake, and libclang for its bindings
          # (both are on the runner image already; Windows has CMake, MSVC and LLVM there too)
          sudo apt-get install -y cmake libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Reader assets match the Swift sources
        run: node scripts/extract-reader-assets.mjs --check

      - name: Reader script tests
        run: node --test scripts/reader-tests/*.test.mjs

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Backend tests
        working-directory: desktop/src-tauri
        run: cargo test

      # Updater artifacts (a .sig for the NSIS, MSI and AppImage installers) are signed with the
      # key in the repository secrets; a release needs them, other builds skip them without it.
      # A release gets the tag's version, whatever tauri.conf.json says.
      - name: Build installers
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--bundles ${{ matrix.bundles }})
          tag="${{ inputs.release_tag }}"
          if [ -n "$tag" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY secret missing"; exit 1; fi
            args+=(--config "{\"version\":\"${tag#v}\"}")
          elif [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx tauri build "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: lunta-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/*/*.sig
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # names that say what they are (see .github/release-notes.md)
          v="${{ inputs.release_tag }}"; v="${v#v}"; b=desktop/src-tauri/target/release/bundle; out=()
          # each with its updater signature (.sig), which latest.json is made from (scripts/update-feeds.sh)
          put() { cp "$1" "$2"; out+=("$2"); if [ -f "$1.sig" ]; then cp "$1.sig" "$2.sig"; out+=("$2.sig"); fi; }
          for f in $b/msi/*.msi; do put "$f" "Lunta-$v-Windows.msi"; done
          for f in $b/nsis/*.exe; do put "$f" "Lunta-$v-Windows-Setup.exe"; done
          for f in $b/appimage/*.AppImage; do put "$f" "Lunta-$v-Linux.AppImage"; done
          for f in $b/deb/*.deb; do cp "$f" "Lunta-$v-Linux-Ubuntu-Debian.deb"; out+=("Lunta-$v-Linux-Ubuntu-Debian.deb"); done
          gh release upload "${{ inputs.release_tag }}" --clobber -R "${{ github.repository }}" "${out[@]}"
