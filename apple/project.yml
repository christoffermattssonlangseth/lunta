# Generate the Xcode project with:  cd apple && xcodegen generate
name: Lunta
options:
  bundleIdPrefix: com.cmlangseth
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  LuntaCore:
    path: LuntaCore
  Paper2EpubKit:
    path: Paper2EpubKit
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.18.3"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: "3.32.3"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

settings:
  base:
    DEVELOPMENT_TEAM: 7R6QL53THM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LuntaMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
      - Assets.xcassets
      - Lunta.icon   # Icon Composer bundle: light/dark/tinted on macOS 26
      - path: ../tts/lunta_tts.py
        buildPhase: resources
      - path: citations
        type: folder
        buildPhase: resources
    dependencies:
      - package: LuntaCore
        product: LuntaCore
      - package: Paper2EpubKit
        product: Paper2EpubKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXFoundationModels
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    postCompileScripts:
      - name: Embed lunta-mcp (agent server and CLI)
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          cd "$SRCROOT/../core" && cargo build --release --bin lunta-mcp
          dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/lunta-mcp"
          cp -f target/release/lunta-mcp "$dest"
          codesign --force --options runtime --timestamp=none -s "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$dest"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Lunta
        CFBundleName: Lunta
        LSApplicationCategoryType: public.app-category.education
        CFBundleURLTypes:
          - CFBundleURLName: com.cmlangseth.margins
            CFBundleURLSchemes: [lunta, margins]   # margins:// from before the rename
        NSHumanReadableCopyright: ""
    entitlements:
      path: Mac/Lunta.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_NAME: Lunta
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins
        ASSETCATALOG_COMPILER_APPICON_NAME: Lunta
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-lc++"]
        # Apple silicon only: the Rust core is built for arm64 (scripts/build-core.sh), and Apple
        # Intelligence and the MLX models need Apple silicon anyway
        ARCHS: arm64

  LuntaiOS:
    type: application
    platform: iOS
    sources: [iOS, Shared, Assets.xcassets, ShareExtension/ShareInbox.swift]
    dependencies:
      - target: LuntaShare
      - package: LuntaCore
        product: LuntaCore
      - package: Paper2EpubKit
        product: Paper2EpubKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXFoundationModels
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: FluidAudio
        product: FluidAudio
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Lunta
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: iOS/Lunta.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cmlangseth.margins]
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_NAME: Lunta
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        TARGETED_DEVICE_FAMILY: "1,2"

  LuntaShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Lunta
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/LuntaShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cmlangseth.margins]
    settings:
      base:
        PRODUCT_NAME: LuntaShare
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins.ios.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
