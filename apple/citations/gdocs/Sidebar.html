<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>{{CSS}}</style>
<script>{{COMMON}}</script>
</head>
<body>
<header><strong>Lunta</strong><select id="style" title="Citation style" disabled></select></header>
<div id="journal" class="journal" hidden>
  <div class="jrow"><input id="jq" type="search" placeholder="Journal name, e.g. Neuron, eLife" autocomplete="off"><button id="jclose" title="Close">✕</button></div>
  <div id="jresults"></div>
</div>
<div id="pair" class="journal" hidden>
  <p class="hint">Enter the pairing key shown in Lunta › Citations in Word &amp; Google Docs… on your Mac.</p>
  <div class="jrow"><input id="pairkey" type="text" placeholder="Pairing key" autocomplete="off" spellcheck="false"><button id="pairsave">Pair</button></div>
</div>
<input id="q" type="search" placeholder="Search your library…" autocomplete="off">
<div id="results"></div>
<div id="picked" class="picked"></div>
<div class="buttons"><button id="insert" class="primary" disabled>Insert Citation</button></div>
<div class="buttons"><button id="bib" disabled>Insert Bibliography</button><button id="refresh" disabled>Update All</button></div>
<div class="buttons"><button id="edit" disabled title="The citation where the cursor is: a page, prefix or suffix for a paper, or the author left out or in the text">Edit Citation at Cursor</button></div>
<div id="current" class="current" hidden>
  <div class="current-h">This citation <button id="cclose" class="cite-x" title="Close">✕</button></div>
  <div id="citelist"></div>
</div>
<div class="buttons"><button id="convert" disabled title="Make citations inserted with Zotero Lunta citations: you review the papers first, nothing changes until you click Convert">Convert Citations from Zotero…</button></div>
<div id="convertBox" class="resolve" hidden>
  <div class="current-h">Convert Citations <button id="cvclose" class="cite-x" title="Close">✕</button></div>
  <div id="cvlist"></div>
</div>
<div class="buttons"><button id="plain" disabled title="For the version you submit: every Lunta citation and the bibliography become ordinary text, as they look now. Do it on a copy of the document.">Convert Citations to Plain Text…</button></div>
<div id="plainBox" class="resolve" hidden>
  <div class="current-h">Convert Citations to Plain Text <button id="plainClose" class="cite-x" title="Close">✕</button></div>
  <p id="plainText" class="hint"></p>
  <div class="buttons"><button id="plainGo" class="primary">Convert to Plain Text</button><button id="plainCancel">Cancel</button></div>
</div>
<div class="buttons"><button id="claims" disabled title="Does each cited paper plausibly support its sentence? Lunta shows the best-matching passages (and, with an on-device model, a suggested verdict). Nothing in the document changes.">Check Citations…</button></div>
<div id="claimsBox" class="resolve" hidden>
  <div class="current-h">Check Citations <button id="clstop" class="cite-x" title="Stop" hidden>Stop</button><button id="clclose" class="cite-x" title="Close">✕</button></div>
  <div id="cllist"></div>
</div>
<p id="status" class="status"></p>
<script>
// Sidebar version: Code.gs must be at least this (both are pasted from Lunta together).
var SIDEBAR_VERSION = 6;
var BASE = 'https://localhost:47481/api', TOKEN = '{{TOKEN}}';
var picked = [], style = null, styleTitle = '', key = TOKEN, busy = false, ready = false, lastSearch = 0;
var checking = false, stopChecking = false, claimItems = [];   // Check Citations
function $(id) { return document.getElementById(id); }
function status(m, err) { $('status').textContent = m || ''; $('status').className = 'status' + (err ? ' err' : ''); }
function api(path, body, timeout) {
  return LuntaCite.request(BASE + path, { body: body, timeout: timeout, headers: { 'X-Margins-Token': key } }).catch(function (e) {
    if (e.kind === 'http' && e.status === 403) $('pair').hidden = false;
    throw e;
  });
}
function server(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, fail) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
      var err = e instanceof Error ? e : new Error(String(e && e.message || e));
      err.kind = 'script';
      if (/not found|is not defined|Script function/i.test(err.message)) {
        err.message = 'This document’s Lunta script is out of date. Copy Code.gs and Sidebar.html again from Lunta › Citations in Word & Google Docs… (Extensions › Apps Script), then reload the document.';
      }
      fail(err);
    });
    r[fn].apply(r, args);
  });
}
function showError(e) { status(LuntaCite.describe(e, 'gdocs'), true); }
function setButtons() {
  $('insert').disabled = busy || !ready || !picked.length;
  $('bib').disabled = $('refresh').disabled = $('edit').disabled = $('convert').disabled = $('plain').disabled = $('plainGo').disabled = busy || !ready;
  $('style').disabled = busy || !ready;
  $('claims').disabled = !ready || checking;
}
/** Runs one change to the document at a time. */
function exclusive(fn) {
  return function () {
    if (busy || !ready) return;
    busy = true; setButtons();
    return Promise.resolve().then(fn).catch(showError).then(function () { busy = false; setButtons(); });
  };
}
function renderPicked() {
  $('picked').textContent = picked.length ? 'Citing: ' + LuntaCite.pickedLabel(picked) : '';
  setButtons();
  document.querySelectorAll('.hit').forEach(function (el) { el.classList.toggle('on', picked.some(function (p) { return p.id === el.dataset.id; })); });
}
function search(q) {
  if (!q.trim()) { $('results').innerHTML = ''; return; }
  var mine = ++lastSearch;
  api('/search?q=' + encodeURIComponent(q)).then(function (hits) {
    if (mine !== lastSearch) return;   // a later search answered first
    $('results').innerHTML = hits.length ? '' : '<p class="status">No papers match.</p>';
    hits.forEach(function (h) {
      var el = document.createElement('div'); el.className = 'hit'; el.dataset.id = h.id;
      el.innerHTML = '<div class="t"></div><div class="m"></div>';
      el.querySelector('.t').textContent = h.title || 'Untitled';
      el.querySelector('.m').textContent = LuntaCite.hitMeta(h);
      el.onclick = function () {
        var i = picked.findIndex(function (p) { return p.id === h.id; });
        if (i >= 0) picked.splice(i, 1); else picked.push(h);
        renderPicked();
      };
      $('results').appendChild(el);
    });
    renderPicked();
  }).catch(function (e) { if (mine === lastSearch) showError(e); });
}

/** Works out and writes every citation and the bibliography; starts over if the document changed meanwhile. */
function update(attempt) {
  attempt = attempt || 0;
  status('Updating…');
  return server('getState').then(function (st) {
    var lists = st.citations, ids = LuntaCite.citedIds(lists), papers = LuntaCite.detailsFor(st.papers, ids), offline = false;
    var options = (st.options || []).map(LuntaCite.decodeOptions);
    var work;
    if (LuntaCite.isJournal(style)) {
      var body = { style: style.slice(4), citations: lists, papers: papers }, opts = LuntaCite.renderOptions(options, lists);
      if (opts) body.options = opts;
      work = api('/render', body, 90000).then(function (res) {
        styleTitle = res.title || styleTitle;
        return LuntaCite.formatJournal(res, lists, st.papers);
      });
    } else {
      work = (ids.length ? api('/bibliography', { style: style, ids: ids, papers: papers }) : Promise.resolve({ entries: [] }))
        .catch(function (e) { if (e.kind !== 'offline') throw e; offline = true; return { entries: null }; })
        .then(function (res) {
          return LuntaCite.format(style, lists, res.entries, st.papers, options);
        });
    }
    return work.then(function (f) {
      if (f.unknown.length) {
        if (offline) { status(LuntaCite.unknownMessage(f.unknown.length, true), true); return; }
        return server('selectCitation', f.unknown[0]).then(function () {
          status(LuntaCite.unknownMessage(f.unknown.length, false), true);
        });
      }
      var plan = {
        keys: lists.map(function (l) { return l.join(','); }), texts: f.texts, superscripts: f.superscripts,
        bibliography: st.hasBibliography ? f.bibliography.map(function (e) { return LuntaCite.runs(e.text); }) : null,
        style: style, styleTitle: LuntaCite.isJournal(style) ? styleTitle : '', papers: f.store
      };
      return server('applyPlan', plan).then(function (r) {
        if (r.changed) {
          if (attempt < 3) return update(attempt + 1);
          throw new Error('The document kept changing while updating (someone typing?). Click Update All again.');
        }
        var name = LuntaCite.isJournal(style) ? (f.title || LuntaCite.styleName(style, styleTitle)) : LuntaCite.styleName(style);
        status(LuntaCite.summary(r.count, f.references, name, f.fromDocument, offline) + (r.saved === false ? ' · (too many papers to keep a copy in the document)' : ''));
      });
    });
  });
}

var insert = exclusive(function () {
  var ids = picked.map(function (p) { return p.id; });
  var sup = !!(LuntaCite.STYLES[style] || {}).superscript;
  return server('insertCitation', ids, '(…)', sup).then(function () {
    picked = []; renderPicked();
    return update().catch(function (e) {
      throw new Error(LuntaCite.describe(e, 'gdocs') + ' The citation is in the document; Update All fills it in.');
    });
  });
});
var insertBib = exclusive(function () {
  return server('insertBibliography', []).then(function (r) {
    if (r && r.exists) status('This document already has a bibliography. Updating it…');
    return update();
  });
});
var updateAll = exclusive(function () { return update(); });

// ---- a citation's options (each paper's page, prefix, suffix, author) ----
var current = null, editing = null;
var editCitation = exclusive(function () {
  return server('citationAtCursor').then(function (c) {
    if (!c) { status('Click inside a citation in the document first, then Edit Citation at Cursor.'); return; }
    current = { index: c.index, ids: c.ids, opts: LuntaCite.decodeOptions(c.options) || {}, text: c.text };
    editing = null;
    showCurrent();
  });
});
function showCurrent() {
  var box = $('current'), list = $('citelist');
  if (!current) { box.hidden = true; list.innerHTML = ''; return; }
  box.hidden = false; list.innerHTML = '';
  var hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = current.text;
  list.appendChild(hint);
  current.ids.forEach(function (id) {
    var row = document.createElement('div');
    row.className = 'cite-row';
    row.innerHTML = '<div class="cite-text"><div class="t">…</div><div class="o"></div></div><button class="cite-o" title="Page, prefix, suffix, author">Page…</button>';
    row.querySelector('.o').textContent = LuntaCite.optionsLabel(current.opts[id]);
    row.querySelector('.cite-o').onclick = function () { editing = editing === id ? null : id; showCurrent(); };
    list.appendChild(row);
    api('/bibliography', { style: 'apa', ids: [id] }).then(function (r) { var e = (r.entries || [])[0]; if (e && !e.missing) row.querySelector('.t').textContent = e.title || 'Untitled'; }).catch(function () {});
    if (editing === id) {
      var form = LuntaCite.optionsForm(document, current.opts[id], function (o) { setPaperOptions(id, o); }, function () { editing = null; showCurrent(); });
      list.appendChild(form);
      setTimeout(form.focusFirst, 0);
    }
  });
}
function setPaperOptions(id, o) {
  var c = current;
  exclusive(function () {
    var map = Object.assign({}, c.opts);
    map[id] = o;
    map = LuntaCite.cleanOptions(map, c.ids);
    return server('setCitationOptions', c.index, c.ids.join(','), LuntaCite.optionRangeNames(LuntaCite.encodeOptions(map))).then(function (ok) {
      if (!ok) throw new Error('That citation changed or moved in the meantime. Click in it and Edit Citation at Cursor again.');
      current = { index: c.index, ids: c.ids, opts: map || {}, text: c.text };
      editing = null; showCurrent();
      return update();
    });
  })();
}

// ---- converting Zotero's citations ----
var conversion = null;
var convertZotero = exclusive(function () {
  status('Looking for Zotero citations…');
  return Promise.all([server('zoteroScan'), api('/status')]).then(function (x) {
    var z = x[0];
    if ((x[1].api || 0) < 4) throw new Error('This version of Lunta can’t convert citations. Update Lunta and try again.');
    var seen = {}, cites = [], bibs = [], unreadable = 0;
    z.runs.forEach(function (r) {
      if (seen[r.key]) return;
      seen[r.key] = true;
      var code = LuntaCite.zoteroDocsCode(LuntaCite.zoteroDocsJoin(z.names, r.key));
      if (!code) unreadable++;
      else if (code.kind === 'bib') bibs.push(r.key);
      else cites.push({ key: r.key, works: code.works, text: r.text, source: 'Zotero' });
    });
    var notes = [];
    if (unreadable) notes.push(unreadable + ' Zotero citation' + (unreadable === 1 ? '' : 's') + ' had no details in the document and will stay as they are.');
    if (z.paperpile) notes.push('Paperpile’s citations (' + z.paperpile + ') can’t be converted: Paperpile keeps their details on its own server.');
    if (!cites.length) { status(notes.length ? notes.join(' ') : 'This document has no Zotero citations.', !!notes.length); return; }
    var first = LuntaCite.convertPlan(cites);
    return api('/match', { items: first.works.map(function (w) { return w.meta; }) }, 60000).then(function (r) {
      var plan = LuntaCite.convertPlan(cites, r.matches || []);
      conversion = { plan: plan, bibs: bibs, unreadable: unreadable };
      $('convertBox').hidden = false;
      if (bibs.length) notes.push(unreadable ? 'Zotero’s bibliography stays, as some of its citations can’t be read.' : 'Zotero’s bibliography becomes Lunta’s once all its citations are converted.');
      LuntaCite.convertReview(document, $('cvlist'), plan, notes, runConversion, closeConvert);
      status(LuntaCite.convertSummary(plan) + '. Review, then Convert.');
    });
  });
});
function closeConvert() { conversion = null; $('convertBox').hidden = true; $('cvlist').innerHTML = ''; }
function runConversion(keys) {
  var conv = conversion;
  exclusive(function () {
    var added = {}, newPapers = 0, chain = Promise.resolve();
    keys.forEach(function (k) {
      var w = conv.plan.works[conv.plan.byKey[k]];
      chain = chain.then(function () {
        return api('/add', { meta: w.meta }, 60000).then(function (p) { if (p && p.id) { added[k] = p.id; if (p.added) newPapers++; } });
      });
    });
    return chain.then(function () {
      var res = LuntaCite.convertResolve(conv.plan, added);
      var cites = res.convert.map(function (c) {
        return { key: conv.plan.citations[c.index].key, ids: c.ids, names: LuntaCite.optionRangeNames(LuntaCite.encodeOptions(c.options)) };
      });
      var left = res.left.map(function (l) { return { text: conv.plan.citations[l.index].text, reason: l.reason }; });
      // Zotero's bibliography stays while any of its citations does (left out, or unreadable)
      var keepBibs = left.length > 0 || conv.unreadable > 0;
      return server('getState').then(function (st) {
        return server('zoteroConvert', cites, keepBibs ? [] : conv.bibs, !st.hasBibliography);
      }).then(function (r) {
        if (keepBibs && conv.bibs.length) left.push({ text: '', reason: 'Zotero’s bibliography stays until its citations are converted' });
        closeConvert();
        return update().then(function () {
          status(LuntaCite.convertDone(r.converted, left, newPapers) + ' ' + $('status').textContent, left.length > 0);
        });
      });
    });
  })();
}

// ---- Convert Citations to Plain Text: warned first (it can't be undone), then Update All and the links removed ----
function openPlain() { $('plainText').textContent = LuntaCite.PLAIN_WARNING; $('plainBox').hidden = false; status(''); }
function closePlain() { $('plainBox').hidden = true; }
var convertToPlain = exclusive(function () {
  closePlain();
  return update().catch(function (e) {
    throw new Error(LuntaCite.describe(e, 'gdocs') + ' Nothing was converted to plain text.');
  }).then(function () {
    status('Converting to plain text…');
    return server('plainText');
  }).then(function (r) {
    status(LuntaCite.plainDone(r.cites, r.bib));
  });
});

// ---- Check Citations: each citation's sentence against the cited papers (common.js, Lunta's /claims) ----
function showClaims() {
  LuntaCite.claimsReview(document, $('cllist'), claimItems, {
    open: function (link) {
      var l = LuntaCite.parseOpenLink(link);
      if (l) api('/open', { id: l.id, find: l.find }, 8000).catch(showError);
    },
    changed: function () { status(LuntaCite.claimSummary(LuntaCite.claimCounts(claimItems, LuntaCite.claimDecisions())) + '.'); }
  });
}
function checkCitations() {
  if (!ready || checking) return;
  checking = true; stopChecking = false; setButtons();
  status('Reading the citations…');
  Promise.all([server('claimParagraphs'), server('getState'), api('/status')]).then(function (x) {
    if ((x[2].api || 0) < 5) throw new Error('This version of Lunta can’t check citations. Update Lunta and try again.');
    var sites = LuntaCite.claimSites(x[0]);
    if (!sites.length) { status('This document has no Lunta citations to check.'); return; }
    $('claimsBox').hidden = false; $('clstop').hidden = false;
    $('cllist').textContent = LuntaCite.CLAIM_PRIVACY;
    return LuntaCite.runClaims(sites, function (body) { return api('/claims', body, 180000); },
      function (i, n) { status('Checking citation ' + (i + 1) + ' of ' + n + '…'); },
      function () { return stopChecking; }, x[1].papers).then(function (items) {
      claimItems = items;
      showClaims();
      status(LuntaCite.claimSummary(LuntaCite.claimCounts(items, LuntaCite.claimDecisions())) + (stopChecking ? ' (stopped).' : '.'));
    });
  }).catch(showError).then(function () { checking = false; $('clstop').hidden = true; setButtons(); });
}
function closeClaims() { stopChecking = true; $('claimsBox').hidden = true; $('cllist').innerHTML = ''; claimItems = []; status(''); }

function setStyle(s, title) {
  style = s; styleTitle = title || '';
  LuntaCite.fillStyles($('style'), style, styleTitle);
  return server('setStyle', style, styleTitle).then(function () { return update(); });
}

(function () {
  var sel = $('style');
  sel.onchange = function () {
    if (sel.value === '__find') { sel.value = style; $('journal').hidden = false; $('jq').focus(); return; }
    exclusive(function () { return setStyle(sel.value); })();
  };
  var jt; $('jq').addEventListener('input', function (e) {
    clearTimeout(jt);
    var q = e.target.value;
    jt = setTimeout(function () {
      if (!q.trim()) { $('jresults').innerHTML = ''; return; }
      $('jresults').innerHTML = '<p class="status">Searching…</p>';
      api('/styles?q=' + encodeURIComponent(q), null, 60000).then(function (hits) {
        LuntaCite.showJournals($('jresults'), hits, function (s, title) {
          $('journal').hidden = true; $('jq').value = ''; $('jresults').innerHTML = '';
          exclusive(function () { return setStyle(s, title); })();
        });
      }).catch(function (e) { $('jresults').innerHTML = ''; showError(e); });
    }, 300);
  });
  $('jclose').onclick = function () { $('journal').hidden = true; $('jq').value = ''; $('jresults').innerHTML = ''; };
  $('pairsave').onclick = function () {
    var k = $('pairkey').value.trim();
    if (!k) return;
    server('setPairingKey', k).then(function () {
      key = k; $('pair').hidden = true; $('pairkey').value = '';
      return api('/status').then(function (s) { status('Paired with Lunta · ' + s.papers + ' papers'); });
    }).catch(showError);
  };
  var t; $('q').addEventListener('input', function (e) { clearTimeout(t); t = setTimeout(function () { search(e.target.value); }, 250); });
  $('insert').onclick = insert; $('bib').onclick = insertBib; $('refresh').onclick = updateAll;
  $('edit').onclick = editCitation; $('cclose').onclick = function () { current = null; showCurrent(); };
  $('convert').onclick = convertZotero; $('cvclose').onclick = closeConvert;
  $('plain').onclick = openPlain; $('plainGo').onclick = convertToPlain; $('plainCancel').onclick = closePlain; $('plainClose').onclick = closePlain;
  $('claims').onclick = checkCitations; $('clclose').onclick = closeClaims; $('clstop').onclick = function () { stopChecking = true; };
  LuntaCite.fillStyles(sel, 'apa');
  status('Loading…');
  // the document's style first: until it is known, nothing may be updated (it would be in the wrong style)
  server('getState').then(function (st) {
    if (!st || !st.version || st.version < SIDEBAR_VERSION) {
      throw new Error('This document’s Lunta script is out of date. Copy Code.gs and Sidebar.html again from Lunta › Citations in Word & Google Docs… (Extensions › Apps Script), then reload the document.');
    }
    if (st.key) key = st.key;
    style = LuntaCite.isStyle(st.style) ? st.style : 'apa';
    styleTitle = st.styleTitle || '';
    LuntaCite.fillStyles(sel, style, styleTitle);
    ready = true; setButtons();
    return api('/status').then(function (s) { status('Connected to Lunta · ' + s.papers + ' papers'); }, function (e) {
      if (e.kind === 'offline' && st.citations.length) status('Lunta isn’t running. Update All still works from the copy of the cited papers saved in this document; to search and cite, open Lunta.', true);
      else showError(e);
    });
  }).catch(showError);
})();
</script>
</body>
</html>
