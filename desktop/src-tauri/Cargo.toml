[package]
name = "lunta-desktop"
version = "1.2.91"
description = "Lunta for Windows and Linux: the library and reader on top of the Rust core"
edition = "2021"
license = "MIT"

[lib]
name = "lunta_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "llm": on-device AI (summaries, Ask) with llama.cpp, built by CMake (src/ai.rs)
lunta-core = { path = "../../core", features = ["convert", "llm"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
# updates from GitHub Releases (latest.json, src/updates.rs)
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
# Word citing (citeserver.rs, citecerts.rs): https://localhost:47481 with a local, name-constrained
# certificate authority; rustls with ring, as the updater's reqwest already has it
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
time = "0.3"
x509-parser = "0.18"

[dev-dependencies]
semver = "1"
tempfile = "3"

# Word citing on Windows (citesetup.rs): the user's Root certificate store, DPAPI for the
# authority's key, the registry key Word loads add-ins from
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Registry"] }

[profile.release]
opt-level = "s"
lto = true

# Debug-only window snapshots for the scripted UI checks (src/devsnap.rs); not used by release builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
