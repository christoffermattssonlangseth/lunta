[package]
name = "lunta-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Library, metadata, search, sync and citation core for the Lunta reference manager"

[lib]
name = "lunta_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "lunta-mcp"
path = "src/bin/lunta-mcp.rs"

[[bin]]
name = "paper2epub"
path = "src/bin/paper2epub.rs"
required-features = ["convert"]

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = "3"
thiserror = "2"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.38", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "tiff", "bmp", "webp"], optional = true }
ab_glyph = { version = "0.2", optional = true }
url = { version = "2", optional = true }
ttf-parser = { version = "0.25", optional = true }

[profile.release]
opt-level = "s"
lto = true

[features]
# The paper -> EPUB converter (core/src/convert). On by default for `cargo build/test/run`;
# scripts/build-core.sh builds the Apple static library with --no-default-features, so the
# apps' LuntaCore stays as it was (they keep using the Swift Paper2EpubKit).
default = ["convert"]
convert = ["dep:quick-xml", "dep:image", "dep:ab_glyph", "dep:ttf-parser", "dep:url"]
