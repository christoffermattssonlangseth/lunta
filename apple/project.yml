# Generate the Xcode project with:  cd apple && xcodegen generate
name: Margins
options:
  bundleIdPrefix: com.cmlangseth
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  MarginsCore:
    path: MarginsCore
  Paper2EpubKit:
    path: Paper2EpubKit
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.18.3"

settings:
  base:
    DEVELOPMENT_TEAM: 7R6QL53THM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MarginsMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
      - Assets.xcassets
      - path: ../tts/margins_tts.py
        buildPhase: resources
    dependencies:
      - package: MarginsCore
        product: MarginsCore
      - package: Paper2EpubKit
        product: Paper2EpubKit
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Margins
        CFBundleName: Margins
        LSApplicationCategoryType: public.app-category.education
        CFBundleURLTypes:
          - CFBundleURLName: com.cmlangseth.margins
            CFBundleURLSchemes: [margins]
        NSHumanReadableCopyright: ""
    entitlements:
      path: Mac/Margins.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_NAME: Margins
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["-lc++"]

  MarginsiOS:
    type: application
    platform: iOS
    sources: [iOS, Shared, Assets.xcassets]
    dependencies:
      - package: MarginsCore
        product: MarginsCore
      - package: Paper2EpubKit
        product: Paper2EpubKit
      - package: FluidAudio
        product: FluidAudio
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Margins
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: iOS/Margins.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.cmlangseth.margins]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_NAME: Margins
        PRODUCT_BUNDLE_IDENTIFIER: com.cmlangseth.margins.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        TARGETED_DEVICE_FAMILY: "1,2"
