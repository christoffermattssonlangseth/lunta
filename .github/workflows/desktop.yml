# Builds the desktop app (desktop/, Tauri 2) for Windows (MSI + NSIS installer) and Linux
# (AppImage + .deb), and uploads the installers as workflow artifacts.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'core/**', 'apple/Shared/**', 'scripts/extract-reader-assets.mjs', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'core/**', 'apple/Shared/**', 'scripts/extract-reader-assets.mjs', '.github/workflows/desktop.yml']
  workflow_dispatch:
  # release.yml runs this for a version tag and attaches the result to the release
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Reader assets match the Swift sources
        run: node scripts/extract-reader-assets.mjs --check

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Backend tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build installers
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: lunta-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # names that say what they are (see .github/release-notes.md)
          v="${{ inputs.release_tag }}"; v="${v#v}"; b=desktop/src-tauri/target/release/bundle; out=()
          for f in $b/msi/*.msi; do cp "$f" "Lunta-$v-Windows.msi"; out+=("Lunta-$v-Windows.msi"); done
          for f in $b/nsis/*.exe; do cp "$f" "Lunta-$v-Windows-Setup.exe"; out+=("Lunta-$v-Windows-Setup.exe"); done
          for f in $b/appimage/*.AppImage; do cp "$f" "Lunta-$v-Linux.AppImage"; out+=("Lunta-$v-Linux.AppImage"); done
          for f in $b/deb/*.deb; do cp "$f" "Lunta-$v-Linux-Ubuntu-Debian.deb"; out+=("Lunta-$v-Linux-Ubuntu-Debian.deb"); done
          gh release upload "${{ inputs.release_tag }}" --clobber -R "${{ github.repository }}" "${out[@]}"
