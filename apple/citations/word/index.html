<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunta Citations</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="../common.js?v=3"></script>
<link rel="stylesheet" href="../panel.css?v=3">
</head>
<body>
<header>
  <img src="../icons/icon-32.png" alt="" width="20" height="20"><strong>Lunta</strong> <small id="ver" style="opacity:.55"></small>
  <select id="style" title="Citation style"></select>
</header>
<input id="q" type="search" placeholder="Search your library: title, author, words…" autocomplete="off">
<div id="results"></div>
<div id="picked" class="picked"></div>
<div class="buttons">
  <button id="insert" class="primary" disabled>Insert Citation</button>
</div>
<div class="buttons">
  <button id="bib">Insert Bibliography Here</button>
  <button id="refresh">Update All</button>
</div>
<p id="status" class="status"></p>
<script src="app.js?v=3"></script>
</body>
</html>
