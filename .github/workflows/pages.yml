# Publishes the website (site/: the home page, download, getting started, support and privacy pages) and the
# hosted Word add-in panel (apple/citations: the Microsoft store listing's manifest-store.xml points here) to
# GitHub Pages: https://getlunta.app (custom domain, set in the repository's Pages settings; before it,
# https://getlunta.app/)
name: Pages

on:
  push:
    branches: [main]
    paths: ['apple/citations/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R apple/citations/. _site/
          cp -R site/. _site/
          rm -rf _site/gdocs        # the Google Docs script is pasted from Lunta, not hosted
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages looks the artifact up straight after the upload; GitHub sometimes doesn't list it yet
      # ("No artifacts named github-pages were found", 24 Nov 2026, several runs in a row), so wait a little
      - name: Let GitHub register the artifact
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
