# Builds the desktop app (desktop/, Tauri 2) for Windows (MSI + NSIS installer) and Linux
# (AppImage + .deb), and uploads the installers as workflow artifacts.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'core/**', 'apple/Shared/**', 'scripts/extract-reader-assets.mjs', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'core/**', 'apple/Shared/**', 'scripts/extract-reader-assets.mjs', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Reader assets match the Swift sources
        run: node scripts/extract-reader-assets.mjs --check

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Backend tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build installers
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: lunta-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
